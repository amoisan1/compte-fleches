<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archery Tracker - Courbe de Progression</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #1a1a1a; --card: #2d2d2d; --primary: #00d1b2; --text: #f5f5f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        .counter-card { background: var(--card); padding: 25px; border-radius: 25px; text-align: center; margin-bottom: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .total { font-size: 4.5rem; font-weight: bold; color: var(--primary); margin: 5px 0; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { padding: 18px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.1s; }
        button:active { transform: scale(0.96); opacity: 0.8; }
        .btn-main { background: var(--primary); color: #1a1a1a; grid-column: span 2; }
        .btn-sec { background: #4a4a4a; color: white; }
        .btn-save { background: #3273dc; color: white; grid-column: span 2; margin-top: 10px; }
        .chart-container { background: var(--card); padding: 15px; border-radius: 25px; margin-bottom: 20px; height: 230px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .history-section { background: var(--card); padding: 15px; border-radius: 20px; }
        #historyList { max-height: 150px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #3d3d3d; }
        .history-item:last-child { border: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="counter-card">
        <span style="font-size: 0.9rem; opacity: 0.7;">Flèches à ajouter</span>
        <div class="total" id="currentCount">0</div>
        <div class="btn-grid">
            <button class="btn-main" onclick="updateCount(6)">+ 6 Flèches</button>
            <button class="btn-main" onclick="updateCount(3)">+ 3 Flèches</button>
            <button class="btn-sec" onclick="updateCount(-1)">- 1</button>
            <button class="btn-sec" onclick="updateCount(1)">+ 1</button>
            <button class="btn-save" onclick="saveToDailyTotal()">Enregistrer pour aujourd'hui</button>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="progressionChart"></canvas>
    </div>

    <div class="history-section">
        <h3 style="margin: 0 0 10px 0; font-size: 1rem;">Total par jour</h3>
        <div id="historyList"></div>
    </div>
</div>

<script>
    let tempCount = 0; // Compteur temporaire (la volée en cours)
    let dailyHistory = JSON.parse(localStorage.getItem('archeryDailyHistory')) || [];
    let chart;

    function updateCount(n) {
        tempCount = Math.max(0, tempCount + n);
        document.getElementById('currentCount').innerText = tempCount;
        if (navigator.vibrate) navigator.vibrate(40);
    }

    function saveToDailyTotal() {
        if (tempCount === 0) return;
        
        const today = new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
        
        // Logique de cumul : on cherche si la date du jour existe déjà
        const dayIndex = dailyHistory.findIndex(entry => entry.date === today);
        
        if (dayIndex !== -1) {
            // Si le jour existe, on ajoute au total existant
            dailyHistory[dayIndex].value += tempCount;
        } else {
            // Sinon on crée une nouvelle entrée
            dailyHistory.unshift({ date: today, value: tempCount });
        }
        
        // Sauvegarde et Reset
        localStorage.setItem('archeryDailyHistory', JSON.stringify(dailyHistory));
        tempCount = 0;
        document.getElementById('currentCount').innerText = tempCount;
        refreshUI();
    }

    function refreshUI() {
        renderHistory();
        updateChart();
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        list.innerHTML = dailyHistory.slice(0, 10).map(s => `
            <div class="history-item">
                <span>Le ${s.date}</span>
                <strong>${s.value} flèches</strong>
            </div>
        `).join('');
    }

    function updateChart() {
        // On prend les 7 derniers jours pour le graphique, et on les remet dans l'ordre chronologique (gauche à droite)
        const displayData = [...dailyHistory].slice(0, 7).reverse();
        const labels = displayData.map(d => d.date);
        const values = displayData.map(d => d.value);

        if (chart) chart.destroy();
        const ctx = document.getElementById('progressionChart').getContext('2d');
        
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Flèches',
                    data: values,
                    borderColor: '#00d1b2',
                    backgroundColor: 'rgba(0, 209, 178, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3, // Courbe lisse
                    pointBackgroundColor: '#00d1b2',
                    pointRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, grid: { color: '#3d3d3d' }, ticks: { color: '#aaa' } },
                    x: { grid: { display: false }, ticks: { color: '#aaa' } }
                },
                plugins: {
                    legend: { display: false }
                }
            }
        });
    }

    // Initialisation au chargement
    refreshUI();
</script>

</body>
</html>
